include = [
    '*.F',
    '*.f',
    '*.F90',
    '*.f90',
    '*.pf'
]

[check]
extend-exclude = [
    'src/dynamics/mpas/assets',
    'src/dynamics/mpas/dycore'
]
force-exclude = true
# Do not apply or suggest any fixes automatically. Manual intervention is required.
fix = false
fixable = []
# When ignoring a linting rule, a reason should be provided for documentation purposes.
ignore = [
    'C003', # Temporarily ignored due to lack of support for the Fortran 2018 `implicit none (external)` statement
            # in the NVIDIA HPC SDK as of version 25.11.
    'C182', # Requiring separate allocations and deallocations for each variable is too restrictive.
            # Related variables can be grouped together at the discretion of developers.
    'S102'  # Prefer only one space instead of two.
]
line-length = 132
output-format = 'grouped'
preview = true
select = [
    'ALL'
]
target-std = 'f2018'

[check.complexity]
max-args = 10
max-complexity = 20

[check.exit-unlabelled-loops]
allow-unnested-loops = true

[check.inconsistent-dimensions]
prefer-attribute = 'never'

[check.incorrect-keyword-case]
keyword-case = 'lowercase'

[check.invalid-tab]
indent-width = 4

[check.keyword-whitespace]
goto-with-space = false
inout-with-space = false

[check.line-too-long]
ignore-comments = false

[check.portability]
allow-cray-file-units = false

[check.strings]
quotes = 'single'

[check.use-statements]
allow-bare-use = [
    'funit',
    'pfunit'
]
