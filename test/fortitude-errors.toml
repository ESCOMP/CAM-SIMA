include = [
    '*.F',
    '*.f',
    '*.F90',
    '*.f90',
    '*.pf'
]

[check]
extend-exclude = [
    'src/dynamics/mpas'
]
force-exclude = true
# Do not apply or suggest any fixes automatically. Manual intervention is required.
fix = false
fixable = []
# When ignoring a linting rule, a reason should be provided for documentation purposes.
output-format = 'grouped'
preview = true
select = [
  'E000',   # Fortitude can't read file (likely a system error)
  'E011',   # Non-ASCII character in file (can cause compilers to fail; excludes comments)
  'C001',   # Module uses implicit typing
  'C021',   # No real suffix
  'C022',   # Implicit real kind
  'C032',   # Magic IO unit
  'C043',   # File opened without action specifier
  'C081',   # Variable initialized in declaration with no 'save' or 'parameter' attribute
  'C132',   # Module has default 'public' accessibility
  'C142',   # 'Cycle' or 'exit' in unlabeled nested do loop
  'C152',   # Line continuation in inline if-statement is misleading
  'C161',   # Short-circuited logical expression (i.e. need to nest conditional within "present" check)
  'C183',   # Stat without error message
  'C191',   # Unreachable statement
  'MOD011', # Old array syntax
  'MOD021', # Deprecated relational operator
  'MOD051', # Save statement is superfluous at module level
  'S061',   # End statment should be named
  'S071',   # Variable declaration missing '::'
  'S201',   # 'implicit none' set on the enclosing module
  'S221',   # Function missing result() specifier
  'S261'    # Inconsistent specification of dimension
]
target-std = 'f2018'

[check.exit-unlabelled-loops]
allow-unnested-loops = true

[check.inconsistent-dimensions]
prefer-attribute = 'never'

[check.incorrect-keyword-case]
keyword-case = 'lowercase'

[check.per-file-ignores]
# pFUnit generates a suite driver that calls every `@test` procedure by name,
# so a test module has to export all of them.
'*.pf' = [
    'C132' # Module has default `public` accessibility
]
